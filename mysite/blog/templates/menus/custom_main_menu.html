{% load menu_tags %}

<ul>

{% for item in menu_items %}
    <li class="{{ item.active_class }}">
        <a href="{{ item.href }}">{{ item.text }}</a>
        {% if item.has_children_in_menu %}
            {% sub_menu item %}
        {% endif %}
    </li>
{% endfor %}

</ul>
{% flat_menu 'google' max_levels=1 show_menu_heading=False  fall_back_to_default_site_menus=True %}
